name: Articles
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Articles:
    type: application
    platform: iOS
    sources:
      - path: Project
        excludes: [Info.plist]
    info:
      path: Project/Info.plist
      properties:
        CFBundleDisplayName: Articles
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajvi.articles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ArticlesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Articles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajvi.articles.tests
        GENERATE_INFOPLIST_FILE: YES
  ArticlesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Articles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajvi.articles.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Articles:
    build:
      targets:
        Articles: all
        ArticlesTests: [test]
        ArticlesUITests: [test]
    test:
      targets: [ArticlesTests, ArticlesUITests]
      gatherCoverageData: true
