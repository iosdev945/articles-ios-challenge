name: iOS build and tests
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "Docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "Docs/**"]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install locked dependencies
        run: bundle exec pod install --deployment
      - name: Test on iPhone
        run: Scripts/test.sh
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Logs/Test/*.xcresult
